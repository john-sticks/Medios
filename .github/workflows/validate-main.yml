name: Build and publish production image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check backup agent HTTPS transport
        run: python3 -m unittest discover -s tests -p test_backup_agent.py -v

      - name: Restore
        run: dotnet restore Medios.sln

      - name: Build
        run: dotnet build Medios.sln --configuration Release --no-restore

      - name: Check authentication and local authorization
        run: dotnet run --project tests/Medios.AuthChecks/Medios.AuthChecks.csproj --configuration Release

      - name: Check synthesis publishing and modification
        run: dotnet run --project tests/Medios.WorkflowChecks/Medios.WorkflowChecks.csproj --configuration Release

      - name: Render editable Word samples
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-urw-base35 poppler-utils
          mkdir -p "$RUNNER_TEMP/word-qa/docx" "$RUNNER_TEMP/word-qa/rendered" "$HOME/.config/fontconfig/conf.d"
          printf '%s' '<fontconfig><alias><family>Bookman Old Style</family><prefer><family>URW Bookman</family></prefer></alias></fontconfig>' > "$HOME/.config/fontconfig/conf.d/99-bookman.conf"
          fc-cache -f
          dotnet run --project tests/Medios.WorkflowChecks/Medios.WorkflowChecks.csproj -c Release --no-build -- --word-samples "$RUNNER_TEMP/word-qa/docx"
          libreoffice -env:UserInstallation="file://$RUNNER_TEMP/lo-word-qa" --headless --convert-to pdf --outdir "$RUNNER_TEMP/word-qa/rendered" "$RUNNER_TEMP/word-qa/docx/"*.docx
          for tipo in Matutina Vespertina Ampliacion_Vespertina Especial; do
            pdfinfo "$RUNNER_TEMP/word-qa/rendered/$tipo.pdf"
            pdftoppm -scale-to 1500 -png "$RUNNER_TEMP/word-qa/rendered/$tipo.pdf" "$RUNNER_TEMP/word-qa/rendered/$tipo"
          done

      - name: Save Word preview for visual review
        uses: actions/upload-artifact@v4
        with:
          name: word-export-preview
          path: ${{ runner.temp }}/word-qa
          retention-days: 5

      - name: Build production image
        run: docker build --tag medios:validate .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Publish production image
        if: github.event_name == 'push'
        env:
          IMAGE: johnsticks/medios
        run: |
          docker tag medios:validate "$IMAGE:${GITHUB_SHA}"
          docker tag medios:validate "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
